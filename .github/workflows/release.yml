name: Release a new version

on:
  push:
    branches: [master]

jobs:
  release:
    name: Release a new version 🚀
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PNPM 🧰
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Release 🚀
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
