name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: E2E tests
        run: pnpm test:e2e

  api:
    name: API tests
    needs: format-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Build
        run: pnpm build

      - name: Run the server
        id: server
        background: true
        run: node --run start:prod

      - name: Run API tests
        uses: usebruno/bruno-cli-action@v1
        with:
          working-directory: test/api
          command: run --env development

      - name: Stop the server
        cancel: server
