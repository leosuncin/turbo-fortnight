info:
  name: List alll tasks
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/task"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.responseTime
      operator: lt
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
