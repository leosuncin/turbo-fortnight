info:
  name: Get hello
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('response body', () => {
          expect(res.body).to.be.equal('Hello World!');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.responseTime
      operator: lt
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
